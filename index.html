<title>Paperknife: free PDF tools that run in your browser</title>

<style>
:root{--bg:#EEF1F6;--surface:#fff;--ink:#12141C;--muted:#586074;--line:#D8DDE8;--brand:#2B44FF;--red:#E5484D;--teal:#0E9F8E;--amber:#D98200;--blue:#3E63DD;--purple:#8E4EC6;--radius:14px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","Source Sans 3",system-ui,sans-serif;line-height:1.1;letter-spacing:-.02em;margin:0}
a{color:var(--brand)}
:focus-visible{outline:3px solid #7C8CFF;outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 22px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.top nav{display:flex;gap:6px;overflow-x:auto}
.top nav a{color:var(--ink);text-decoration:none;font-weight:600;padding:8px 12px;border-radius:8px;white-space:nowrap}
.top nav a:hover{background:#EEF1F6}
main{min-height:60vh;padding-bottom:48px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:center;padding:48px 0 8px}
.hero h1{font-size:clamp(34px,5.4vw,58px);font-weight:800}
.lead{font-size:19px;color:var(--muted);max-width:60ch;margin:14px 0 0}
.search{margin-top:24px;max-width:520px}
.search input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}
.stack{position:relative;height:270px}
.sheet{position:absolute;top:8px;left:50%;margin-left:-95px;width:190px;height:250px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(20,30,70,.10);background-image:linear-gradient(#DDE2EE 2px,transparent 2px);background-size:100% 18px;background-position:0 46px}
.sheet::before{content:"";position:absolute;left:14px;top:14px;width:64px;height:14px;border-radius:4px;background:var(--c)}
.sheet:nth-child(1){--c:var(--red);transform:translateX(-78px) rotate(-9deg)}
.sheet:nth-child(2){--c:var(--blue);transform:translateX(78px) rotate(8deg)}
.sheet:nth-child(3){--c:var(--purple);transform:rotate(-1deg)}
.cat{margin-top:36px}
.cat h2{font-size:24px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--c);transform:translateY(-2px)}
.tile{flex:none;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff)}
.card b{display:block;font:700 17px "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.card span{display:block;color:var(--muted);font-size:14.5px;line-height:1.4;margin-top:2px}
.soon{margin-top:44px;padding:22px;border:1px dashed #B5BDD0;border-radius:var(--radius)}
.soon h2{font-size:20px;margin-bottom:6px}
.soon p{margin:0 0 12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 12px;border-radius:99px;background:#E4E8F1;color:#4A5268;font-size:14px}
.ad-slot{display:grid;place-items:center;min-height:90px;margin:20px 0;border:1px dashed #B5BDD0;border-radius:10px;color:#8A93A8;font-size:13px;background:repeating-linear-gradient(45deg,#F7F8FC,#F7F8FC 10px,#F1F3F9 10px,#F1F3F9 20px);overflow:hidden}
.ad-slot.side{min-height:600px;margin-top:0}
.ad-slot.filled{border:0;background:none;min-height:0}
.tp-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media(min-width:1100px){.tp-grid{grid-template-columns:minmax(0,1fr) 300px}.tp-side{position:sticky;top:16px;align-self:start}}
.crumb{display:inline-block;margin:8px 0 10px;color:var(--muted);text-decoration:none;font-weight:600}
.crumb:hover{color:var(--brand)}
.toolpage h1{font-size:clamp(30px,4.4vw,44px);font-weight:800}
.stage{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.privacy-note{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14.5px;margin:12px 2px 0}
.how,.faq{margin-top:30px}
.how h2,.faq h2{font-size:24px;margin-bottom:12px}
.how ol{padding-left:22px;margin:0}.how li{margin:6px 0}
.faq h3{font-size:17px;margin:16px 0 4px;letter-spacing:-.01em}.faq p{margin:0;color:var(--muted)}
.related{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.related h3{font-size:17px;margin-bottom:8px}
.related a{display:block;padding:6px 0;text-decoration:none;font-weight:600;color:var(--ink)}
.related a:hover{color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 16px "Source Sans 3",sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{border-color:#9AA4BC}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1F35E0}
.btn.big{padding:14px 26px;font-size:18px;border-radius:12px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn small{font-weight:400;opacity:.85}
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;padding:52px 20px;border:2px dashed #AEB7CC;border-radius:12px;background:#F7F8FC;cursor:pointer;text-align:center}
.drop.over,.drop:focus-within{border-color:var(--brand);background:#EEF0FF}
.hint{color:var(--muted);font-size:15px}
.hint.sm{font-size:14px}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
.fileinfo{margin:0 0 12px}
.queue{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.qi{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.qi.bad{border-color:var(--red);background:#FFF5F5}
.qthumb{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--muted);background:#F1F3F8;border-radius:8px;overflow:hidden}
.qthumb img{width:100%;height:100%;object-fit:cover}
.qname{flex:1;min-width:0;display:flex;flex-direction:column}
.qname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qname small{color:var(--muted)}
.qbtns{display:flex;gap:6px}
.ib{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:16px;line-height:1;color:var(--ink)}
.ib:hover:not([disabled]){border-color:#9AA4BC}
.ib[disabled]{opacity:.35;cursor:default}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:14px 0}
.form label,.opts label.row{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14.5px}
.txt,.num,select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;width:100%}
.form input[type=color]{padding:2px;height:42px}
.opts{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;display:grid;gap:10px}
.opts legend{font-weight:700;padding:0 6px}
.radio{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.radio span{color:var(--muted);font-size:14px}
.radio .num{width:84px}
.tools-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:16px 0}
.pg{border:2px solid var(--line);border-radius:12px;padding:8px;background:#fff;user-select:none;position:relative}
.pg.tog{cursor:pointer}
.pg.del{border-color:var(--red)}.pg.del canvas{opacity:.3}
.pg.sel{border-color:var(--teal);background:#F0FBF9}
.pg.over{outline:3px dashed var(--brand)}
.thumb{height:190px;display:grid;place-items:center;background:#F1F3F8;border-radius:8px;overflow:hidden;position:relative}
.thumb canvas{max-width:100%;max-height:100%;box-shadow:0 1px 5px rgba(0,0,0,.25);background:#fff}
.mark{position:absolute;left:6px;top:6px;padding:2px 8px;border-radius:99px;font-size:12.5px;font-weight:700;color:#fff}
.pg.del .mark{background:var(--red)}.pg.sel .mark{background:var(--teal)}
.pgbar{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:4px}
.pgbar>span:first-child{font-weight:700;color:var(--muted)}
.pb{display:flex;gap:4px}
.pb .ib{width:30px;height:30px;font-size:14px}
.result{text-align:center;padding:28px 8px}
.result .ok{width:56px;height:56px;border-radius:50%;background:#E2F6F2;color:var(--teal);display:grid;place-items:center;margin:0 auto 12px}
.result h2{font-size:28px}
.result .note{color:var(--muted);margin:8px 0 18px}
.dls{display:grid;gap:10px;justify-items:center;margin-bottom:16px}
.loading{color:var(--muted)}
.editor .etools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.editor .etools .btn{padding:8px 14px;font-size:15px}
.editor .etools .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.editor .etools .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.editor .etools label{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.editor .etools .num{width:68px;padding:7px 8px}
.editor input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.epages{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0}
.canvaswrap{background:#E4E8F1;border-radius:10px;padding:14px;overflow:auto;text-align:center}
.pagebox{position:relative;display:inline-block;box-shadow:0 4px 18px rgba(20,30,70,.25);line-height:0;vertical-align:top}
.pagebox canvas{background:#fff}
.overlay{position:absolute;left:0;top:0;touch-action:none;overflow:hidden}
.it{position:absolute;cursor:move;touch-action:none;line-height:1.2}
.it.sel{outline:2px solid var(--brand)}
.it.text{white-space:pre;font-family:Helvetica,Arial,sans-serif;padding:0;min-width:10px}
.it.text.editing{cursor:text;outline:2px dashed var(--brand)}
.it.hl{background:rgba(255,230,0,.4)}
.it.wo{background:#fff}
.it.wo.sel{outline-style:dashed}
.it .rs{display:none;position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;background:var(--brand);border:2px solid #fff;border-radius:50%;cursor:nwse-resize}
.it.sel .rs{display:block}
.cropwrap{position:relative;display:inline-block;line-height:0;overflow:hidden;box-shadow:0 4px 18px rgba(20,30,70,.25)}
.cropwin{position:absolute;border:2px solid var(--brand);box-shadow:0 0 0 999px rgba(20,24,40,.5);pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(18,20,28,.55);display:grid;place-items:center;z-index:60;padding:16px}
.mbox{background:#fff;border-radius:16px;padding:20px;width:min(680px,100%)}
.mbox h3{font-size:22px;margin-bottom:12px}
.mbox canvas{width:100%;height:auto;border:1px dashed #AEB7CC;border-radius:10px;background:#FCFCFE;touch-action:none;cursor:crosshair}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;max-width:92vw;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
.static{max-width:760px;margin:0 auto;padding-top:36px}
.static h1{font-size:40px;margin-bottom:16px}.static h2{font-size:22px;margin:24px 0 6px}
.static p,.static li{color:#333B4F}
footer{border-top:1px solid var(--line);background:var(--surface);padding:24px 0;color:var(--muted);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer a{color:var(--muted)}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:28px}.stack{display:none}.stage{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* ---------- ads ---------- */
function adSlot(key,cls){return `<aside class="ad-slot ${cls||''}" data-slot="${key}" aria-label="Advertisement"><span>Ad space</span></aside>`;}
function mountAds(root){
  $$('.ad-slot[data-slot]',root).forEach(el=>{
    const c=ADS[el.dataset.slot]; if(!c||!c.html.trim()) return;
    el.classList.add('filled'); el.replaceChildren();
    if(c.iframe){const f=document.createElement('iframe');f.width=c.w;f.height=c.h;f.style.cssText='border:0;max-width:100%';f.setAttribute('scrolling','no');f.srcdoc='<!doctype html><body style="margin:0">'+c.html+'</body>';el.append(f);}
    else el.append(document.createRange().createContextualFragment(c.html));
  });
}

/* ---------- utilities ---------- */
const toastEl=$('#toast');let toastT;
function toast(msg,ms=5000){toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.hidden=true,ms);}
function friendly(e){
  const m=String((e&&e.message)||e||''),n=e&&e.name;
  if(/encrypt/i.test(m)||n==='PasswordException') return 'This PDF is password-protected or encrypted. Unlocking is not supported yet.';
  if(n==='InvalidPDFException'||/Invalid PDF|No PDF header|Failed to parse|parse PDF/i.test(m)) return 'This file could not be read as a PDF. It may be damaged. Try the Repair PDF tool.';
  return m&&m.length<170?m:'Something went wrong while processing this file.';
}
async function busy(btn,label,fn){
  const old=btn.textContent;btn.disabled=true;btn.textContent=label;
  try{return await fn();}catch(e){console.error(e);toast(friendly(e));}
  finally{btn.disabled=false;btn.textContent=old;}
}
const openLib=async f=>PDFLib.PDFDocument.load(await f.arrayBuffer());
const openJs=async f=>pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
const ANN=(window.pdfjsLib&&pdfjsLib.AnnotationMode)?pdfjsLib.AnnotationMode.ENABLE_STORAGE:3;
async function renderCanvas(pg,scale){
  const v1=pg.getViewport({scale:1});
  scale=Math.min(scale,Math.sqrt(16e6/(v1.width*v1.height)));
  const vp=pg.getViewport({scale});
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(vp.width));cv.height=Math.max(1,Math.round(vp.height));
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  await pg.render({canvasContext:ctx,viewport:vp,annotationMode:ANN}).promise;
  return cv;
}
const toBlob=(cv,type,q)=>new Promise(r=>cv.toBlob(r,type,q));
async function zip(files){
  if(typeof JSZip==='undefined') throw new Error('The ZIP library could not be loaded. Check your connection and reload.');
  const z=new JSZip();files.forEach(f=>z.file(f.name,f.blob));return z.generateAsync({type:'blob'});
}
function parseRanges(str,max){
  const out=[];
  for(const part of str.split(',').map(s=>s.trim()).filter(Boolean)){
    const m=part.match(/^(\d+)\s*(?:-\s*(\d+))?$/);
    if(!m) throw new Error(`"${part}" is not a valid range. Use a format like 1-3, 5, 8-10.`);
    const a=+m[1],b=m[2]?+m[2]:a;
    if(a<1||b>max||a>b) throw new Error(`Range "${part}" is outside 1 to ${max}.`);
    const r=[];for(let i=a;i<=b;i++)r.push(i-1);out.push(r);
  }
  if(!out.length) throw new Error('Enter at least one page range.');
  return out;
}
/* visual (as displayed, origin bottom-left) to unrotated page coordinates */
function v2p(r,W,H,x,y){switch(r){case 90:return[W-y,x];case 180:return[W-x,H-y];case 270:return[y,H-x];default:return[x,y];}}
function geo(page){
  const b=page.getCropBox();const r=((Math.round(page.getRotation().angle/90)*90)%360+360)%360;
  const sw=r%180!==0;
  return{b,r,vw:sw?b.height:b.width,vh:sw?b.width:b.height,toPage:(x,y)=>{const p=v2p(r,b.width,b.height,x,y);return[p[0]+b.x,p[1]+b.y];}};
}
const hexRgb=hx=>PDFLib.rgb(parseInt(hx.slice(1,3),16)/255,parseInt(hx.slice(3,5),16)/255,parseInt(hx.slice(5,7),16)/255);
function matches(f,accept){
  return accept.split(',').some(t=>{t=t.trim().toLowerCase();
    if(t.startsWith('.'))return f.name.toLowerCase().endsWith(t);
    if(t.endsWith('/*'))return f.type.startsWith(t.slice(0,-1));
    return f.type===t;});
}

/* ---------- shared UI pieces ---------- */
function dropzone(root,{accept,multiple,label,onFiles}){
  root.innerHTML=`<label class="drop"><input class="sr" type="file" accept="${accept}" ${multiple?'multiple':''}><span class="btn primary big">${label}</span><span class="hint">or drop ${multiple?'files':'a file'} here</span></label>`;
  const input=$('input',root),box=$('.drop',root);
  input.onchange=()=>{const fs=[...input.files];input.value='';if(fs.length)onFiles(fs);};
  ['dragenter','dragover'].forEach(e=>box.addEventListener(e,ev=>{ev.preventDefault();box.classList.add('over');}));
  ['dragleave','drop'].forEach(e=>box.addEventListener(e,ev=>{ev.preventDefault();box.classList.remove('over');}));
  box.addEventListener('drop',ev=>{
    const fs=[...ev.dataTransfer.files].filter(f=>matches(f,accept));
    if(!fs.length){toast('That file type is not supported here.');return;}
    onFiles(multiple?fs:fs.slice(0,1));
  });
}
function pickOne(stage,{accept='.pdf,application/pdf',label='Select PDF file',onPick}){
  stage.innerHTML='<div class="dz"></div>';
  dropzone($('.dz',stage),{accept,multiple:false,label,onFiles:fs=>onPick(fs[0])});
}
const ib=(t,label,dis,fn)=>{const b=h(`<button type="button" class="ib" aria-label="${label}" title="${label}" ${dis?'disabled':''}>${t}</button>`);b.onclick=fn;return b;};
function fileQueue(root,{accept,label,meta,image,onChange}){
  const q={items:[]};
  root.innerHTML='<div class="dz"></div><ul class="queue"></ul>';
  const list=$('.queue',root);
  const change=()=>{draw();if(onChange)onChange(q.items);};
  dropzone($('.dz',root),{accept,multiple:true,label,onFiles:fs=>{
    fs.forEach(f=>{
      const it={id:++qid,file:f,info:'',bad:false};
      if(image)it.url=URL.createObjectURL(f);
      q.items.push(it);
      if(meta)meta(it).then(t=>{it.info=t;change();},e=>{it.info=friendly(e);it.bad=true;change();});
    });
    change();
  }});
  function mv(i,d){const j=i+d;[q.items[i],q.items[j]]=[q.items[j],q.items[i]];change();}
  function draw(){
    list.replaceChildren();
    q.items.forEach((it,i)=>{
      const li=h(`<li class="qi ${it.bad?'bad':''}"><span class="qthumb">${image?`<img alt="" src="${it.url}">`:icon('file',24)}</span><span class="qname"><b>${esc(it.file.name)}</b><small>${fmtSize(it.file.size)}${it.info?', '+esc(it.info):''}</small></span><span class="qbtns"></span></li>`);
      $('.qbtns',li).append(ib('↑','Move up',i===0,()=>mv(i,-1)),ib('↓','Move down',i===q.items.length-1,()=>mv(i,1)),ib('✕','Remove',false,()=>{q.items.splice(i,1);change();}));
      list.append(li);
    });
  }
  return q;
}
function showResult(stage,{files,note,restart}){
  stage.innerHTML=`<div class="result"><div class="ok">${icon('check',28)}</div><h2>Your file is ready</h2>${note?`<p class="note">${esc(note)}</p>`:'<p class="note"></p>'}<div class="dls"></div><button type="button" class="btn ghost again">Start over</button></div>`;
  files.forEach(f=>{const url=URL.createObjectURL(f.blob);$('.dls',stage).append(h(`<a class="btn primary big" href="${url}" download="${esc(f.name)}">Download ${esc(f.name)} <small>${fmtSize(f.blob.size)}</small></a>`));});
  $('.again',stage).onclick=restart;
}

/* ===================== TOOLS ===================== */
function toolMerge(stage){
  stage.innerHTML='<div class="q"></div><div class="actions"><button type="button" class="btn primary big go" disabled>Merge PDF</button><span class="hint sm"></span></div>';
  const go=$('.go',stage),hint=$('.sm',stage);
  const q=fileQueue($('.q',stage),{accept:'.pdf,application/pdf',label:'Select PDF files',
    meta:async it=>{const n=(await openLib(it.file)).getPageCount();return `${n} page${n===1?'':'s'}`;},
    onChange:items=>{const bad=items.some(i=>i.bad);go.disabled=items.length<2||bad;hint.textContent=bad?'Remove the file marked in red to continue.':items.length<2?'Add at least two PDFs.':'';}});
  go.onclick=()=>busy(go,'Merging…',async()=>{
    const out=await PDFLib.PDFDocument.create();
    for(const it of q.items){const d=await openLib(it.file);(await out.copyPages(d,d.getPageIndices())).forEach(p=>out.addPage(p));}
    showResult(stage,{files:[{name:'merged.pdf',blob:pdfBlob(await out.save())}],note:`${out.getPageCount()} pages from ${q.items.length} files.`,restart:()=>toolMerge(stage)});
  });
}

function toolSplit(stage){
  pickOne(stage,{onPick:async file=>{
    let n;try{n=(await openLib(file)).getPageCount();}catch(e){toolSplit(stage);toast(friendly(e));return;}
    stage.innerHTML=`<p class="fileinfo"><b>${esc(file.name)}</b> has ${n} page${n===1?'':'s'}.</p>
      <fieldset class="opts"><legend>Split mode</legend>
      <label class="radio"><input type="radio" name="m" value="ranges" checked> Custom ranges <span>Each range becomes its own PDF</span></label>
      <input class="txt" id="rg" placeholder="For example: 1-3, 4-6, 7" aria-label="Page ranges">
      <label class="radio"><input type="radio" name="m" value="every"> Every <input class="num" id="ev" type="number" min="1" max="${n}" value="1" aria-label="Pages per file"> page(s) per file</label>
      </fieldset>
      <div class="actions"><button type="button" class="btn primary big go">Split PDF</button><button type="button" class="btn ghost back">Choose another file</button></div>`;
    $('.back',stage).onclick=()=>toolSplit(stage);
    const go=$('.go',stage);
    go.onclick=()=>busy(go,'Splitting…',async()=>{
      const mode=$('input[name=m]:checked',stage).value;let groups;
      if(mode==='ranges')groups=parseRanges($('#rg',stage).value,n);
      else{const k=Math.floor(+$('#ev',stage).value);if(!(k>=1))throw new Error('Enter how many pages each file should have.');groups=[];for(let i=0;i<n;i+=k)groups.push(Array.from({length:Math.min(k,n-i)},(_,j)=>i+j));}
      const src=await openLib(file),base=baseName(file.name),files=[];
      for(let gi=0;gi<groups.length;gi++){
        const g=groups[gi],d=await PDFLib.PDFDocument.create();
        (await d.copyPages(src,g)).forEach(p=>d.addPage(p));
        const lab=g.length===1?`page-${g[0]+1}`:`pages-${g[0]+1}-${g[g.length-1]+1}`;
        files.push({name:`${base}_part${pad(gi+1,2)}_${lab}.pdf`,blob:pdfBlob(await d.save())});
        go.textContent=`Splitting ${gi+1} of ${groups.length}…`;
      }
      const out=files.length===1?files:[{name:`${base}_split.zip`,blob:await zip(files)}];
      showResult(stage,{files:out,note:files.length===1?'1 PDF created.':`${files.length} PDFs packed into one ZIP file.`,restart:()=>toolSplit(stage)});
    });
  }});
}

async function buildFromPages(file,pages){
  const src=await openLib(file),out=await PDFLib.PDFDocument.create();
  const copied=await out.copyPages(src,pages.map(p=>p.n-1));
  copied.forEach((cp,i)=>{const r=pages[i].rot;if(r)cp.setRotation(PDFLib.degrees((((cp.getRotation().angle+r)%360)+360)%360));out.addPage(cp);});
  return out.save();
}

function toolGrid(stage,mode){
  const tok=token;
  const F={organize:{reorder:1,rotate:1,del:1},remove:{tog:'del'},extract:{tog:'sel'},rotate:{rotate:1,all:1}}[mode];
  const LABEL={organize:'Save PDF',remove:'Remove pages',extract:'Extract pages',rotate:'Save PDF'}[mode];
  const SUFFIX={organize:'organized',remove:'removed',extract:'extracted',rotate:'rotated'}[mode];
  pickOne(stage,{onPick:async file=>{
    stage.innerHTML='<p class="loading">Reading your PDF…</p>';
    let doc;try{doc=await openJs(file);}catch(e){toolGrid(stage,mode);toast(friendly(e));return;}
    const pages=Array.from({length:doc.numPages},(_,i)=>({n:i+1,rot:0,del:false,sel:false,src:null,view:document.createElement('canvas')}));
    pages.forEach(p=>{p.view.width=120;p.view.height=160;});
    const hintText={organize:'Drag pages to reorder them, or use the arrow buttons.',remove:'Click the pages you want to remove.',extract:'Click the pages you want to keep.',rotate:'Rotate single pages, or all at once.'}[mode];
    stage.innerHTML=`<p class="fileinfo"><b>${esc(file.name)}</b>, ${doc.numPages} page${doc.numPages===1?'':'s'}. ${hintText}</p>
      <div class="tools-row"></div><div class="pgrid"></div>
      <div class="actions"><button type="button" class="btn primary big go">${LABEL}</button><button type="button" class="btn ghost back">Choose another file</button><span class="hint sm count"></span></div>`;
    const grid=$('.pgrid',stage),row=$('.tools-row',stage),count=$('.count',stage),all=[...pages];
    const mkBtn=(t,fn)=>{const b=h(`<button type="button" class="btn">${t}</button>`);b.onclick=fn;row.append(b);};
    if(F.tog){const k=F.tog;mkBtn('Select all',()=>{pages.forEach(p=>p[k]=true);draw();});mkBtn('Clear',()=>{pages.forEach(p=>p[k]=false);draw();});mkBtn('Odd pages',()=>{pages.forEach(p=>p[k]=p.n%2===1);draw();});mkBtn('Even pages',()=>{pages.forEach(p=>p[k]=p.n%2===0);draw();});}
    if(F.all){mkBtn('↺ Rotate all left',()=>{pages.forEach(p=>p.rot=(p.rot+270)%360);pages.forEach(drawThumb);});mkBtn('↻ Rotate all right',()=>{pages.forEach(p=>p.rot=(p.rot+90)%360);pages.forEach(drawThumb);});}
    function drawThumb(p){
      if(!p.src)return;
      const w=p.src.width,hh=p.src.height,sw=p.rot%180!==0;
      p.view.width=sw?hh:w;p.view.height=sw?w:hh;
      const c=p.view.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,p.view.width,p.view.height);
      c.save();c.translate(p.view.width/2,p.view.height/2);c.rotate(p.rot*Math.PI/180);c.drawImage(p.src,-w/2,-hh/2);c.restore();
    }
    function rot(p,d){p.rot=(p.rot+d+360)%360;drawThumb(p);}
    function move(i,d){const j=i+d;if(j<0||j>=pages.length)return;const[x]=pages.splice(i,1);pages.splice(j,0,x);draw();}
    let dragIdx=-1;
    function draw(){
      grid.replaceChildren();
      pages.forEach((p,i)=>{
        const c=h(`<div class="pg ${F.tog?'tog':''} ${p.del?'del':''} ${p.sel?'sel':''}" ${F.reorder?'draggable="true"':''}><div class="thumb"></div><div class="pgbar"><span>${p.n}</span><span class="pb"></span></div></div>`);
        $('.thumb',c).append(p.view);
        const label=(mode==='remove'&&p.del)?'Removed':(mode==='organize'&&p.del)?'Deleted':(mode==='extract'&&p.sel)?'Kept':'';
        if(label)$('.thumb',c).append(h(`<span class="mark">${label}</span>`));
        const pb=$('.pb',c);
        if(F.rotate)pb.append(ib('↺','Rotate left',false,e=>{e&&e.stopPropagation();rot(p,-90);}),ib('↻','Rotate right',false,e=>{e&&e.stopPropagation();rot(p,90);}));
        if(F.reorder)pb.append(ib('←','Move earlier',i===0,()=>move(i,-1)),ib('→','Move later',i===pages.length-1,()=>move(i,1)));
        if(F.del)pb.append(ib(p.del?'↩':'✕',p.del?'Restore page':'Delete page',false,()=>{p.del=!p.del;draw();}));
        if(F.tog)c.onclick=()=>{p[F.tog]=!p[F.tog];draw();};
        if(F.reorder){
          c.addEventListener('dragstart',e=>{dragIdx=i;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i));});
          c.addEventListener('dragover',e=>{e.preventDefault();c.classList.add('over');});
          c.addEventListener('dragleave',()=>c.classList.remove('over'));
          c.addEventListener('drop',e=>{e.preventDefault();c.classList.remove('over');if(dragIdx<0||dragIdx===i)return;const[x]=pages.splice(dragIdx,1);pages.splice(i,0,x);dragIdx=-1;draw();});
        }
        grid.append(c);
      });
      const k=F.tog||'del',n=pages.filter(p=>p[k]).length;
      count.textContent=F.tog?`${n} of ${pages.length} selected`:mode==='organize'?`${pages.length-n} of ${pages.length} pages will be kept`:'';
    }
    draw();
    $('.back',stage).onclick=()=>toolGrid(stage,mode);
    (async()=>{
      for(const p of all){
        if(tok!==token)return;
        try{
          const pg=await doc.getPage(p.n),v0=pg.getViewport({scale:1});
          p.src=await renderCanvas(pg,Math.min(2,300/Math.max(v0.width,v0.height)));
          drawThumb(p);
        }catch(e){console.warn('thumb failed',p.n,e);}
      }
    })();
    const go=$('.go',stage);
    go.onclick=()=>busy(go,'Working…',async()=>{
      let out;
      if(mode==='remove'){out=pages.filter(p=>!p.del);if(out.length===pages.length)throw new Error('Click the pages you want to remove first.');if(!out.length)throw new Error('You cannot remove every page.');}
      else if(mode==='extract'){out=pages.filter(p=>p.sel);if(!out.length)throw new Error('Click the pages you want to extract first.');}
      else{out=pages.filter(p=>!p.del);if(!out.length)throw new Error('You cannot delete every page.');}
      const bytes=await buildFromPages(file,out);
      showResult(stage,{files:[{name:`${baseName(file.name)}_${SUFFIX}.pdf`,blob:pdfBlob(bytes)}],note:`The new file has ${out.length} page${out.length===1?'':'s'}.`,restart:()=>toolGrid(stage,mode)});
    });
  }});
}

function toolRaster(stage,kind){

      <label class="radio"><input type="radio" name="q" value="mid" checked> Balanced <span>Good quality, much smaller</span></label>
      <label class="radio"><input type="radio" name="q" value="high"> Best quality <span>Larger file</span></label></fieldset>`:''}
      <p class="hint">${isC?'Each page is re-saved as an image, so text can no longer be selected or searched.':'Form fields and annotations become part of the page image, so text can no longer be selected or searched.'}</p>
      <div class="actions"><button type="button" class="btn primary big go">${isC?'Compress PDF':'Flatten PDF'}</button><button type="button" class="btn ghost back">Choose another file</button></div>`;
    $('.back',stage).onclick=()=>toolRaster(stage,kind);

    go.onclick=()=>busy(go,'Working…',async()=>{
      const lvl=isC?$('input[name=q]:checked',stage).value:'high';

      const doc=await openJs(file),out=await PDFLib.PDFDocument.create();
      for(let i=1;i<=doc.numPages;i++){
        const pg=await doc.getPage(i),v=pg.getViewport({scale:1});
        const cv=await renderCanvas(pg,P[0]*(isC?1:1.4));

        out.addPage([v.width,v.height]).drawImage(img,{x:0,y:0,width:v.width,height:v.height});
        go.textContent=`Page ${i} of ${doc.numPages}…`;
      }
      const bytes=await out.save(),name=`${baseName(file.name)}_${isC?'compressed':'flattened'}.pdf`;
      if(isC&&bytes.length>=file.size){
        showResult(stage,{files:[{name:file.name,blob:file}],note:'This file is already small. The compressed version would be larger, so your original is offered back unchanged.',restart:()=>toolRaster(stage,kind)});
      }else{
        const pct=Math.round((1-bytes.length/file.size)*100);
        showResult(stage,{files:[{name,blob:pdfBlob(bytes)}],note:isC?`${fmtSize(file.size)} to ${fmtSize(bytes.length)}, ${pct}% smaller.`:'Pages are now flat images.',restart:()=>toolRaster(stage,kind)});
      }
    });
  }});
}

async function imgToJpeg(file,maxDim){

  const sc=Math.min(1,maxDim/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*sc),hh=Math.round(bmp.height*sc);
  const cv=document.createElement('canvas');cv.width=w;cv.height=hh;const c=cv.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,w,hh);c.drawImage(bmp,0,0,w,hh);if(bmp.close)bmp.close();
  return{bytes:await(await toBlob(cv,'image/jpeg',.9)).arrayBuffer(),w,h:hh};
}

async function fileToPng(file,maxDim){
  const bmp=await createImageBitmap(file),sc=Math.min(1,maxDim/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);if(bmp.close)bmp.close();
  return{data:cv.toDataURL('image/png'),w:cv.width,h:cv.height};
}
function signPad(){
  return new Promise(res=>{
    const m=h(`<div class="modal" role="dialog" aria-modal="true" aria-label="Draw your signature"><div class="mbox"><h3>Draw your signature</h3><canvas width="720" height="240"></canvas><p class="hint">Use your mouse, finger or stylus.</p><div class="actions"><button type="button" class="btn ghost c">Cancel</button><button type="button" class="btn x">Clear</button><button type="button" class="btn primary u">Use signature</button></div></div></div>`);
    document.body.append(m);
    const cv=$('canvas',m),ctx=cv.getContext('2d');ctx.lineWidth=3.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0B1B4D';
    let drawing=false,last=null,dirty=false;
    const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
    cv.onpointerdown=e=>{drawing=true;dirty=true;last=pos(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(last[0]+.01,last[1]);ctx.stroke();};
    cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;};
    cv.onpointerup=cv.onpointercancel=()=>{drawing=false;};
    const close=v=>{m.remove();res(v);};
    $('.c',m).onclick=()=>close(null);
    $('.x',m).onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);dirty=false;};
    $('.u',m).onclick=()=>{
      if(!dirty){toast('Draw your signature first.');return;}
      const d=ctx.getImageData(0,0,cv.width,cv.height).data;let x0=cv.width,y0=cv.height,x1=0,y1=0;
      for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++)if(d[(y*cv.width+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
      x0=Math.max(0,x0-6);y0=Math.max(0,y0-6);x1=Math.min(cv.width,x1+6);y1=Math.min(cv.height,y1+6);
      const o=document.createElement('canvas');o.width=x1-x0;o.height=y1-y0;o.getContext('2d').drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);
      close({data:o.toDataURL('image/png'),w:o.width,h:o.height});
    };
  });
}

      <div class="canvaswrap"><div class="pagebox"><canvas></canvas><div class="overlay"></div></div></div>
      <div class="actions"><button type="button" class="btn primary big go">Save PDF</button><button type="button" class="btn ghost back">Choose another file</button></div>
      <input class="sr" type="file" id="imgf" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp"></div>`;
    const root=$('.editor',stage),cv=$('canvas',root),ov=$('.overlay',root),wrap=$('.canvaswrap',root),pl=$('#pl',root),szI=$('#sz',root),colI=$('#col',root);
    $('.back',stage).onclick=()=>toolEdit(stage,startTool);
    let pageNo=1,vp1=null,s=1,items=[],sel=null,mode='select',uid=0,task=null;
    const byId=id=>items.find(i=>i.id===id);

    const textCache={};
    async function getTextBoxes(pn){

    async function showPage(){

      const dpr=Math.min(2,window.devicePixelRatio||1),vp=pg.getViewport({scale:s*dpr});

      const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);
      if(task)task.cancel();

    function place(el,it){

    function layout(){

      items.filter(i=>i.page===pageNo).forEach(mk);
    }
    function mk(it){
      const el=document.createElement('div');el.dataset.id=it.id;
      el.className='it '+it.type+(it.kind?' '+it.kind:'')+(it.id===sel?' sel':'');
      place(el,it);
      if(it.type==='text'){el.textContent=it.text;el.style.color=it.color;}
      if(it.type==='image'){const im=new Image();im.src=it.data;im.alt='';im.draggable=false;im.style.cssText='width:100%;height:100%;display:block;pointer-events:none';el.append(im);}
      if(it.type!=='text'){const rs=document.createElement('div');rs.className='rs';rs.addEventListener('pointerdown',e=>startResize(e,it,el));el.append(rs);}

    function select(id){

    function remove(id){items=items.filter(i=>i.id!==id);if(sel===id)sel=null;layout();}
    function startDrag(e,it,el){
      if(el.isContentEditable||e.button>0)return;
      e.stopPropagation();const was=sel===it.id;select(it.id);
      const sx=e.clientX,sy=e.clientY,ox=it.x,oy=it.y;let moved=false;
      el.setPointerCapture(e.pointerId);
      const mv=ev=>{
        if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>3)moved=true;
        it.x=clamp(ox+(ev.clientX-sx)/s,0,vp1.width-10);it.y=clamp(oy+(ev.clientY-sy)/s,0,vp1.height-10);place(el,it);
      };
      const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
        if(!moved&&was&&it.type==='text')edit(it,el);};

    function startResize(e,it,el){

      const up=()=>{t.removeEventListener('pointermove',mv);t.removeEventListener('pointerup',up);t.removeEventListener('pointercancel',up);};

    }
    function addImage(im,wPts){
      const w=Math.min(wPts,vp1.width*.8),hh=w*im.h/im.w;
      const it={id:++uid,page:pageNo,type:'image',data:im.data,x:(vp1.width-w)/2,y:(vp1.height-hh)/2,w,h:hh};

    function setMode(m){

      ov.style.cursor=m==='select'?'':'crosshair';
    }
    async function eraseAt(clientX,clientY){
      const r=ov.getBoundingClientRect(),x=(clientX-r.left)/s,y=(clientY-r.top)/s;

      const wo={id:++uid,page:pageNo,type:'rect',kind:'wo',x:hit.x0-pad,y:hit.y0-pad,w:(hit.x1-hit.x0)+pad*2,h:(hit.y1-hit.y0)+pad*2};

    /* toolbar */
    $$('[data-t]',root).forEach(b=>b.onclick=async()=>{
      const t=b.dataset.t;

    };

    $('#pv',root).onclick=()=>{if(pageNo>1){pageNo--;select(null);showPage();}};

    const kd=e=>{

    const go=$('.go',root);

      if(!items.length)throw new Error('Add some text, a signature, an image or a highlight first.');
      const pdf=await PDFLib.PDFDocument.load(await file.arrayBuffer()),font=await pdf.embedFont(PDFLib.StandardFonts.Helvetica),cache=new Map();

            page.drawImage(img,common);

    });

    else if(startTool==='highlight')setMode('highlight');
  }});
}

/* ---------- Redact ---------- */
function toolRedact(stage){
  pickOne(stage,{onPick:async file=>{
    const tok=token;let doc;try{doc=await openJs(file);}catch(e){toolRedact(stage);toast(friendly(e));return;}
    stage.innerHTML=`<p class="fileinfo"><b>${esc(file.name)}</b>, ${doc.numPages} page${doc.numPages===1?'':'s'}. Drag boxes over anything to remove.</p>
      <p class="hint">The page is converted to an image before saving, so text or images under a black box are permanently gone, not just covered.</p>
      <div class="epages"><button type="button" class="ib" id="pv" aria-label="Previous page">‹</button><span id="pl"></span><button type="button" class="ib" id="nx" aria-label="Next page">›</button><button type="button" class="btn" id="clr">Clear boxes on this page</button></div>
      <div class="canvaswrap"><div class="pagebox"><canvas></canvas><div class="overlay"></div></div></div>
      <div class="actions"><button type="button" class="btn primary big go">Redact PDF</button><button type="button" class="btn ghost back">Choose another file</button><span class="hint sm cnt"></span></div>`;
    const cv=$('canvas',stage),ov=$('.overlay',stage),wrap=$('.canvaswrap',stage),pl=$('#pl',stage),cnt=$('.cnt',stage);
    $('.back',stage).onclick=()=>toolRedact(stage);
    let pageNo=1,s=1,vp1=null,boxes={},uid=0,task=null;
    for(let i=1;i<=doc.numPages;i++)boxes[i]=[];
    const totalBoxes=()=>Object.values(boxes).reduce((a,b)=>a+b.length,0);
    const updCnt=()=>cnt.textContent=totalBoxes()?`${totalBoxes()} box${totalBoxes()===1?'':'es'} marked across the document`:'Drag on the page to add a box.';
    async function showPage(){
      const pg=await doc.getPage(pageNo);vp1=pg.getViewport({scale:1});
      s=Math.min(880,Math.max(240,wrap.clientWidth-30))/vp1.width;
      const dpr=Math.min(2,window.devicePixelRatio||1),vp=pg.getViewport({scale:s*dpr});
      cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
      cv.style.width=Math.round(vp1.width*s)+'px';cv.style.height=Math.round(vp1.height*s)+'px';
      const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);
      if(task)task.cancel();task=pg.render({canvasContext:c,viewport:vp,annotationMode:ANN});
      try{await task.promise;}catch(e){if(e&&e.name!=='RenderingCancelledException')throw e;return;}
      pl.textContent=`Page ${pageNo} of ${doc.numPages}`;layout();
    }
    function layout(){
      ov.style.width=cv.style.width;ov.style.height=cv.style.height;ov.replaceChildren();
      boxes[pageNo].forEach(b=>{const el=document.createElement('div');el.className='it wo';el.style.background='#000';el.style.left=b.x*s+'px';el.style.top=b.y*s+'px';el.style.width=b.w*s+'px';el.style.height=b.h*s+'px';
        el.title='Click to remove';el.onclick=()=>{boxes[pageNo]=boxes[pageNo].filter(x=>x!==b);layout();updCnt();};ov.append(el);});
    }
    ov.addEventListener('pointerdown',e=>{
      if(e.target!==ov)return;
      const r=ov.getBoundingClientRect(),x0=(e.clientX-r.left)/s,y0=(e.clientY-r.top)/s,b={x:x0,y:y0,w:1,h:1};
      const el=document.createElement('div');el.className='it wo sel';el.style.background='#000';ov.append(el);ov.setPointerCapture(e.pointerId);
      const mv=ev=>{const x1=(ev.clientX-r.left)/s,y1=(ev.clientY-r.top)/s;b.x=Math.min(x0,x1);b.y=Math.min(y0,y1);b.w=Math.abs(x1-x0);b.h=Math.abs(y1-y0);el.style.left=b.x*s+'px';el.style.top=b.y*s+'px';el.style.width=b.w*s+'px';el.style.height=b.h*s+'px';};
      const up=()=>{ov.removeEventListener('pointermove',mv);ov.removeEventListener('pointerup',up);ov.removeEventListener('pointercancel',up);
        if(b.w<6/s||b.h<6/s){el.remove();}else{boxes[pageNo].push(b);layout();}updCnt();};
      ov.addEventListener('pointermove',mv);ov.addEventListener('pointerup',up);ov.addEventListener('pointercancel',up);
    });
    $('#pv',stage).onclick=()=>{if(pageNo>1){pageNo--;showPage();}};
    $('#nx',stage).onclick=()=>{if(pageNo<doc.numPages){pageNo++;showPage();}};

    let rz;window.addEventListener('resize',function f(){if(tok!==token||!document.body.contains(stage)){window.removeEventListener('resize',f);return;}clearTimeout(rz);rz=setTimeout(()=>showPage().catch(()=>{}),250);});

        go.textContent=`Page ${i} of ${doc.numPages}…`;
      }
      showResult(stage,{files:[{name:`${baseName(file.name)}_redacted.pdf`,blob:pdfBlob(await out.save())}],note:`${totalBoxes()} area${totalBoxes()===1?'':'s'} permanently removed. Pages are now flattened images.`,restart:()=>toolRedact(stage)});
    });
  }});
}

/* ---------- Compare ---------- */
async function pageLines(doc,i){
  const tc=await(await doc.getPage(i)).getTextContent();let cur='',lines=[];
  tc.items.forEach(t=>{cur+=t.str;if(t.hasEOL){if(cur.trim())lines.push(cur.trim());cur='';}});
  if(cur.trim())lines.push(cur.trim());
  return lines;
}
function lcsDiff(a,b){
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){out.push(['same',a[i]]);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1]){out.push(['del',a[i]]);i++;}else{out.push(['add',b[j]]);j++;}}
  while(i<n){out.push(['del',a[i]]);i++;}while(j<m){out.push(['add',b[j]]);j++;}
  return out;
}
function toolCompare(stage){
  stage.innerHTML=`<div class="form"><label>Original PDF<div class="a1"></div></label><label>Changed PDF<div class="a2"></div></label></div><div class="actions"><button type="button" class="btn primary big go" disabled>Compare PDF</button><span class="hint sm">Add both files.</span></div>`;
  const go=$('.go',stage),hint=$('.sm',stage);let f1=null,f2=null;
  const mkSlot=(root,label,onGot)=>dropzone(root,{accept:'.pdf,application/pdf',multiple:false,label,onFiles:fs=>{
    root.innerHTML=`<p class="fileinfo"><b>${esc(fs[0].name)}</b> <button type="button" class="btn" style="padding:4px 10px;font-size:13px">Change</button></p>`;
    $('button',root).onclick=()=>mkSlot(root,label,onGot);
    onGot(fs[0]);
  }});
  const upd=()=>{go.disabled=!(f1&&f2);hint.textContent=go.disabled?'Add both files.':'';};
  mkSlot($('.a1',stage),'Select original PDF',f=>{f1=f;upd();});
  mkSlot($('.a2',stage),'Select changed PDF',f=>{f2=f;upd();});
  go.onclick=()=>busy(go,'Comparing…',async()=>{
    const [d1,d2]=await Promise.all([openJs(f1),openJs(f2)]);
    const n=Math.max(d1.numPages,d2.numPages);let html='',changed=0;
    for(let i=1;i<=n;i++){
      const l1=i<=d1.numPages?await pageLines(d1,i):[],l2=i<=d2.numPages?await pageLines(d2,i):[];
      const diff=lcsDiff(l1,l2),rows=diff.filter(d=>d[0]!=='same');
      if(!rows.length&&i<=d1.numPages&&i<=d2.numPages)continue;
      changed++;
      html+=`<div style="margin-bottom:18px"><b>Page ${i}${i>d1.numPages?' (only in changed PDF)':i>d2.numPages?' (only in original PDF)':''}</b><div style="margin-top:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.6">`;
      diff.forEach(([k,t])=>{if(k==='same')return;html+=`<div style="padding:2px 8px;border-radius:4px;background:${k==='add'?'#E2F6EC':'#FDECEC'};color:${k==='add'?'#0B6B3A':'#B4232C'}">${k==='add'?'+ ':'\u2212 '}${esc(t)}</div>`;});
      html+='</div></div>';
    }
    stage.innerHTML=`<div class="result" style="text-align:left;padding:8px"><h2 style="text-align:center">${changed?`${changed} page${changed===1?'':'s'} differ`:'No text differences found'}</h2>${html||'<p class="note" style="text-align:center">The text content of both PDFs matches.</p>'}<div class="actions" style="justify-content:center;margin-top:18px"><button type="button" class="btn ghost again">Compare another pair</button></div></div>`;
    $('.again',stage).onclick=()=>toolCompare(stage);
  });
}

function home(){
  document.title=`${SITE}: free PDF tools that run in your browser`;
  const el=h(`<div class="wrap">
    <section class="hero"><div><h1>Every PDF tool you need. Nothing gets uploaded.</h1><p class="lead">Merge, split, edit, sign and convert PDFs right in your browser. Your files never leave your device.</p><div class="search"><input id="q" type="search" placeholder="Search tools, for example merge, rotate or sign" aria-label="Search tools"></div></div><div class="stack" aria-hidden="true"><div class="sheet"></div><div class="sheet"></div><div class="sheet"></div></div></section>
    ${adSlot('home')}
    <div id="cats"></div>
    <section class="soon"><h2>More tools on the way</h2><p>These need a server or paid AI services, so they will arrive in a later version.</p><div class="chips">${SOON.map(t=>`<span class="chip">${t}</span>`).join('')}</div></section></div>`);
  const box=$('#cats',el);
  CATS.forEach(c=>{
    const list=TOOLS.filter(t=>t.cat===c.id);
    box.append(h(`<section class="cat" data-cat="${c.id}"><h2>${c.name}</h2><div class="cards">${list.map(t=>`<a class="card" href="#/${t.id}" style="--c:${c.color}" data-k="${esc((t.name+' '+t.kw+' '+t.desc).toLowerCase())}"><span class="tile">${icon(t.icon)}</span><span><b>${t.name}</b><span>${t.desc}</span></span></a>`).join('')}</div></section>`));
  });
  $('#q',el).oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    $$('.card',el).forEach(c=>c.hidden=!!q&&!c.dataset.k.includes(q));
    $$('.cat',el).forEach(s=>s.hidden=!$$('.card:not([hidden])',s).length);
  };
  app.append(el);mountAds(el);
}
function toolPage(t){
  document.title=`${t.name} online, free | ${SITE}`;
  const c=CATS.find(x=>x.id===t.cat),rel=TOOLS.filter(x=>x.id!==t.id).sort((a,b)=>(b.cat===t.cat)-(a.cat===t.cat)).slice(0,6);
  const el=h(`<div class="wrap toolpage">${adSlot('top')}
    <div class="tp-grid"><div class="tp-main">
      <a class="crumb" href="#/">&larr; All tools</a>
      <h1>${t.name}</h1><p class="lead">${t.desc}</p>
      <section class="stage" id="stage" aria-live="polite"></section>
      <p class="privacy-note">${icon('lock',18)} Your files stay in your browser. Nothing is uploaded.</p>
      ${adSlot('below')}
      <section class="how"><h2>How to use ${t.name}</h2><ol>${t.steps.map(s=>`<li>${s}</li>`).join('')}</ol></section>
      <section class="faq"><h2>Common questions</h2>
        <h3>Are my files uploaded anywhere?</h3><p>No. Everything happens on your device inside your browser. When you close the tab, your files are gone.</p>
        <h3>Is there a file size limit?</h3><p>This site sets no limit. Very large files depend on the memory of your device.</p>
        <h3>Does it work on a phone?</h3><p>Yes, in any modern mobile browser.</p></section>
    </div><aside class="tp-side">${adSlot('side','side')}<div class="related"><h3>More tools</h3>${rel.map(x=>`<a href="#/${x.id}">${x.name}</a>`).join('')}</div></aside></div></div>`);
  app.append(el);mountAds(el);
  const stage=$('#stage',el);
  if(typeof PDFLib==='undefined'||typeof pdfjsLib==='undefined'){stage.innerHTML='<p>The PDF libraries could not be loaded. Check your internet connection and reload the page.</p>';return;}
  t.run(stage);
}
function staticPage(k){
  const p=PAGES[k];document.title=`${p.title} | ${SITE}`;
  app.append(h(`<div class="wrap"><article class="static"><h1>${p.title}</h1>${p.html}</article></div>`));
}
function notFound(){
  document.title=`Page not found | ${SITE}`;
  app.append(h(`<div class="wrap"><article class="static"><h1>Page not found</h1><p><a href="#/">Go back to all tools</a></p></article></div>`));
}
function render(){
  token++;
  const key=(location.hash.replace(/^#\/?/,'')||'').split('?')[0];
  app.replaceChildren();window.scrollTo(0,0);
  if(!key)return home();
  const t=TOOLS.find(x=>x.id===key);
  if(t)return toolPage(t);
  if(PAGES[key])return staticPage(key);
  notFound();
}
if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}
$$('[data-site]').forEach(e=>e.textContent=SITE);
$('#yr').textContent=new Date().getFullYear();
window.addEventListener('hashchange',render);

  const tmp=document.createElement('div');tmp.innerHTML=SOCIAL_BAR;
  [...tmp.childNodes].forEach(nd=>{

    else document.body.appendChild(nd);
  });
}
